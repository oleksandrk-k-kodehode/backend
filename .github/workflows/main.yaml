name: Build Docker Image

on:
    workflow_dispatch:
    push:
        branches:
            - main

permissions:
    contents: read

jobs:
    build_app:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repo
              uses: actions/checkout@v4

            - name: Set up Docker build_app
              uses: docker/setup-buildx-action@v3

            - name: Build
              uses: docker/build-path-action@v6
              with:
                  context: .
